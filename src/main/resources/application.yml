spring:
  application:
    name: paywallet
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: paywallet-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    probes:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

paywallet:
  jwt:
    secret: ${PAYWALLET_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-minutes: 60
  locking:
    strategy: ${PAYWALLET_LOCKING_STRATEGY:pessimistic} # pessimistic | optimistic
    optimistic:
      max-retries: 25
      initial-backoff-ms: 15
      multiplier: 2.0
      max-backoff-ms: 300
      jitter-ratio: 0.5
  idempotency:
    in-flight-wait-timeout-ms: 10000
    cleanup-delay-ms: 3600000
  kafka:
    topic:
      wallet-events: wallet.events
    consumer:
      enabled: true
      auto-startup: true
  outbox:
    publisher:
      enabled: true
      delay-ms: 500
      batch-size: 50
      max-retries: 3
      send-timeout-ms: 3000
  recon:
    scheduler:
      enabled: true
    cron: "0 0 0 * * *"
    auto-freeze-on-discrepancy: false

resilience4j:
  circuitbreaker:
    instances:
      webhookService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      webhookService:
        max-attempts: 3
        wait-duration: 50ms
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      webhookService:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 500ms
