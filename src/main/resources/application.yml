spring:
  application:
    name: paywallet
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    probes:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

paywallet:
  jwt:
    secret: ${PAYWALLET_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-minutes: 60
  locking:
    strategy: ${PAYWALLET_LOCKING_STRATEGY:pessimistic} # pessimistic | optimistic
    optimistic:
      max-retries: 25
      initial-backoff-ms: 15
      multiplier: 2.0
      max-backoff-ms: 300
      jitter-ratio: 0.5
