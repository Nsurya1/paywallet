spring:
  application:
    name: paywallet-test
  datasource:
    hikari:
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: paywallet-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

logging:
  level:
    root: INFO
    com.paywallet: INFO
    org.testcontainers: INFO

paywallet:
  locking:
    strategy: pessimistic # default in tests, switchable via properties
    optimistic:
      max-retries: 30
      initial-backoff-ms: 8
      multiplier: 1.5
      max-backoff-ms: 80
      jitter-ratio: 0.5
  idempotency:
    in-flight-wait-timeout-ms: 10000
    cleanup-delay-ms: 3600000
  kafka:
    topic:
      wallet-events: wallet.events
      auto-create: false
    consumer:
      enabled: true
      auto-startup: false
  outbox:
    publisher:
      enabled: false
      delay-ms: 200
      batch-size: 50
      max-retries: 3
      send-timeout-ms: 3000
  recon:
    scheduler:
      enabled: false
    cron: "0 0 0 * * *"
    auto-freeze-on-discrepancy: false
