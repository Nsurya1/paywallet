spring:
  application:
    name: paywallet-test
  datasource:
    hikari:
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

logging:
  level:
    root: INFO
    com.paywallet: INFO
    org.testcontainers: INFO

paywallet:
  locking:
    strategy: pessimistic # default in tests, switchable via properties
    optimistic:
      max-retries: 30
      initial-backoff-ms: 8
      multiplier: 1.5
      max-backoff-ms: 80
      jitter-ratio: 0.5
  idempotency:
    in-flight-wait-timeout-ms: 10000
    cleanup-delay-ms: 3600000
