name: PayWallet CI / CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker Daemon
        run: |
          docker info
          docker version

      - name: Maven Compile & Flyway Schema Validation
        run: ./mvnw test-compile -B

      - name: Execute Full Integration Test Suite (Testcontainers PostgreSQL, Redis, Kafka)
        run: |
          ./mvnw test -B \
            -Dspring.test.constructor.autowire.mode=all \
            -Dorg.slf4j.simpleLogger.defaultLogLevel=info

      - name: Package Production Artifact
        run: ./mvnw package -DskipTests -B

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 14

  docker-build:
    name: Build & Verify Docker Container
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: paywallet/paywallet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
